<!-- KPI Cards Grid (العنوان فوق الأيقونة مباشرة باحترافية) -->
<div class="row g-3 mb-4">
    
    <!-- 1. إجمالي المصروفات (الأزرق) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-info fw-bold mb-2 d-block">إجمالي المصروفات</span>
            <div class="kpi-icon icon-blue mx-auto mb-2">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h5 class="kpi-value text-white fw-bold mb-0" id="kpiSpend">11,632,694.85 ج.م</h5>
        </div>
    </div>

    <!-- 2. الميزانية المعتمدة (الأخضر) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-success fw-bold mb-2 d-block">الميزانية المعتمدة</span>
            <div class="kpi-icon icon-green mx-auto mb-2">
                <i class="fa-solid fa-vault"></i>
            </div>
            <h5 class="kpi-value text-white fw-bold mb-0" id="kpiBudget">8,537,491.43 ج.م</h5>
        </div>
    </div>

    <!-- 3. صافي الانحراف (الأحمر الداكن) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-danger fw-bold mb-2 d-block">صافي الانحراف</span>
            <div class="kpi-icon icon-red mx-auto mb-2">
                <i class="fa-solid fa-chart-line-down"></i>
            </div>
            <h5 class="kpi-value text-danger fw-bold mb-0" id="kpiVariance">-3,095,203.42 ج.م</h5>
        </div>
    </div>

    <!-- 4. تجاوزات حرجة (الأحمر التحذيري) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-danger fw-bold mb-2 d-block">تجاوزات حرجة</span>
            <div class="kpi-icon icon-red mx-auto mb-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h5 class="kpi-value text-danger fw-bold mb-0" id="kpiCritical">167</h5>
        </div>
    </div>

    <!-- 5. إنذار مبكر (البرتقالي/الأصفر) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-warning fw-bold mb-2 d-block">إنذار مبكر</span>
            <div class="kpi-icon icon-amber mx-auto mb-2">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h5 class="kpi-value text-warning fw-bold mb-0" id="kpiWarning">2</h5>
        </div>
    </div>

    <!-- 6. إجمالي المرفوضات (الأحمر - حظر) -->
    <div class="col-md-4 col-xl-2">
        <div class="kpi-card text-center p-3">
            <span class="kpi-title text-danger fw-bold mb-2 d-block">إجمالي المرفوضات</span>
            <div class="kpi-icon icon-red mx-auto mb-2">
                <i class="fa-solid fa-ban"></i>
            </div>
            <h5 class="kpi-value text-danger fw-bold mb-0" id="kpiRejected">45</h5>
        </div>
    </div>

</div>
